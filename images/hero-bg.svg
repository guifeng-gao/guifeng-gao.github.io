<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 800" width="1440" height="800">
  <defs>
    <radialGradient id="g1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#95b46a" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#95b46a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cell-hi" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.55)"/>
      <stop offset="50%" stop-color="rgba(255,255,255,0.15)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.03)"/>
    </radialGradient>
    <radialGradient id="rod-hi" cx="30%" cy="30%" r="60%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.40)"/>
      <stop offset="60%" stop-color="rgba(255,255,255,0.10)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.02)"/>
    </radialGradient>
    <radialGradient id="dna-g" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c4a35a" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#c4a35a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Base gradient -->
  <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#184a3a"/>
    <stop offset="50%" stop-color="#14382c"/>
    <stop offset="100%" stop-color="#0a1f16"/>
  </linearGradient>
  <rect width="1440" height="800" fill="url(#bg)"/>

  <!-- Glows -->
  <circle cx="250" cy="350" r="220" fill="url(#g1)"/>
  <circle cx="1150" cy="250" r="200" fill="url(#g1)"/>
  <circle cx="720" cy="450" r="280" fill="url(#dna-g)"/>

  <!-- ====== VISIBLE DNA HELIX ====== -->
  <g opacity="0.30" transform="translate(1050,80) scale(1.2)">
    <path d="M0,0 C25,-50 50,-70 75,-35 C100,0 125,15 150,50" stroke="#c4a35a" stroke-width="3" fill="none"/>
    <path d="M25,-65 C50,-30 75,-15 100,15 C125,45 150,60 175,95" stroke="#c4a35a" stroke-width="3" fill="none"/>
    <line x1="0" y1="0" x2="25" y2="-65" stroke="#c4a35a" stroke-width="1.5" opacity="0.8"/>
    <line x1="75" y1="-35" x2="100" y2="15" stroke="#c4a35a" stroke-width="1.5" opacity="0.8"/>
    <line x1="150" y1="50" x2="175" y2="95" stroke="#c4a35a" stroke-width="1.5" opacity="0.8"/>
  </g>

  <g opacity="0.20" transform="translate(150,550) scale(1.0)">
    <path d="M0,0 C20,-35 40,-50 60,-25 C80,0 100,12 120,40" stroke="#95b46a" stroke-width="2" fill="none"/>
    <path d="M20,-50 C40,-20 60,-10 80,15 C100,40 120,50 140,70" stroke="#95b46a" stroke-width="2" fill="none"/>
    <line x1="0" y1="0" x2="20" y2="-50" stroke="#95b46a" stroke-width="1.2" opacity="0.7"/>
    <line x1="60" y1="-25" x2="80" y2="15" stroke="#95b46a" stroke-width="1.2" opacity="0.7"/>
  </g>

  <!-- ====== LARGE VISIBLE COCCI GROUP ====== -->
  <g opacity="0.40" transform="translate(400,200) scale(1.1)">
    <circle cx="0" cy="0" r="22" fill="url(#cell-hi)" stroke="rgba(255,255,255,0.35)" stroke-width="1.5"/>
    <circle cx="35" cy="-8" r="17" fill="url(#cell-hi)" stroke="rgba(255,255,255,0.30)" stroke-width="1.2"/>
    <circle cx="-28" cy="18" r="14" fill="url(#cell-hi)" stroke="rgba(255,255,255,0.30)" stroke-width="1.2"/>
    <circle cx="18" cy="25" r="12" fill="url(#cell-hi)" stroke="rgba(255,255,255,0.25)" stroke-width="1"/>
    <circle cx="-18" cy="-18" r="10" fill="url(#cell-hi)" stroke="rgba(255,255,255,0.25)" stroke-width="1"/>
    <circle cx="-8" cy="-5" r="6" fill="rgba(255,255,255,0.25)"/>
    <circle cx="10" cy="10" r="5" fill="rgba(255,255,255,0.20)"/>
  </g>

  <!-- ====== VISIBLE ROD BACTERIA ====== -->
  <g opacity="0.35" transform="translate(750,280) rotate(-15)">
    <rect x="-35" y="-10" width="70" height="20" rx="10" fill="url(#rod-hi)" stroke="rgba(255,255,255,0.30)" stroke-width="1.5"/>
    <circle cx="-28" cy="0" r="4" fill="rgba(255,255,255,0.25)"/>
    <circle cx="28" cy="0" r="4" fill="rgba(255,255,255,0.25)"/>
    <circle cx="-10" cy="0" r="3" fill="rgba(255,255,255,0.12)"/>
  </g>

  <g opacity="0.25" transform="translate(600,620) rotate(30)">
    <rect x="-25" cy="-7" width="50" height="14" rx="7" fill="url(#rod-hi)" stroke="rgba(255,255,255,0.25)" stroke-width="1.2"/>
    <circle cx="-18" cy="0" r="3" fill="rgba(255,255,255,0.20)"/>
    <circle cx="18" cy="0" r="3" fill="rgba(255,255,255,0.20)"/>
  </g>

  <!-- ====== BIG NUCLEATED CELL ====== -->
  <g opacity="0.25" transform="translate(870,500) scale(1.2)">
    <circle cx="0" cy="0" r="35" fill="url(#cell-hi)" stroke="rgba(255,255,255,0.22)" stroke-width="2"/>
    <circle cx="0" cy="0" r="20" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="1.5"/>
    <circle cx="-10" cy="-8" r="6" fill="rgba(255,255,255,0.20)"/>
    <circle cx="12" cy="6" r="4" fill="rgba(255,255,255,0.15)"/>
    <circle cx="-6" cy="12" r="3" fill="rgba(255,255,255,0.12)"/>
    <circle cx="4" cy="-4" r="2" fill="rgba(255,255,255,0.10)"/>
  </g>

  <!-- ====== SCATTERED VISIBLE MICROBES ====== -->
  <!-- Cluster 1 -->
  <g opacity="0.30">
    <circle cx="120" cy="220" r="7" fill="rgba(255,255,255,0.35)" stroke="rgba(255,255,255,0.30)" stroke-width="1"/>
    <circle cx="138" cy="232" r="5" fill="rgba(255,255,255,0.25)" stroke="rgba(255,255,255,0.20)" stroke-width="0.8"/>
    <circle cx="128" cy="210" r="4" fill="rgba(255,255,255,0.20)"/>
  </g>

  <!-- Cluster 2 -->
  <g opacity="0.25">
    <circle cx="1280" cy="420" r="8" fill="rgba(255,255,255,0.30)" stroke="rgba(255,255,255,0.25)" stroke-width="1"/>
    <circle cx="1300" cy="435" r="5.5" fill="rgba(255,255,255,0.20)" stroke="rgba(255,255,255,0.18)" stroke-width="0.8"/>
    <circle cx="1290" cy="410" r="3.5" fill="rgba(255,255,255,0.18)"/>
  </g>

  <!-- Single scattered cells -->
  <g opacity="0.20">
    <circle cx="520" cy="450" r="6" fill="rgba(255,255,255,0.22)"/>
    <circle cx="340" cy="300" r="7" fill="rgba(255,255,255,0.20)"/>
    <circle cx="680" cy="380" r="5" fill="rgba(255,255,255,0.18)"/>
  </g>

  <!-- ====== SPIRILLUM (Spiral bacterium) ====== -->
  <g opacity="0.20" transform="translate(550,350) scale(1.0)">
    <path d="M0,0 C5,-12 15,-12 15,0 C15,12 25,12 25,0 C25,-12 35,-12 35,0 C35,12 45,12 45,0" stroke="rgba(255,255,255,0.30)" stroke-width="2.5" fill="none"/>
  </g>

  <!-- ====== FILAMENT (Chain of cells) ====== -->
  <g opacity="0.18" transform="translate(180,480) rotate(40)">
    <circle cx="0" cy="0" r="6" fill="rgba(255,255,255,0.28)" stroke="rgba(255,255,255,0.20)" stroke-width="0.8"/>
    <circle cx="16" cy="0" r="6" fill="rgba(255,255,255,0.28)" stroke="rgba(255,255,255,0.20)" stroke-width="0.8"/>
    <circle cx="32" cy="0" r="6" fill="rgba(255,255,255,0.28)" stroke="rgba(255,255,255,0.20)" stroke-width="0.8"/>
    <circle cx="48" cy="0" r="6" fill="rgba(255,255,255,0.28)" stroke="rgba(255,255,255,0.20)" stroke-width="0.8"/>
    <circle cx="64" cy="0" r="6" fill="rgba(255,255,255,0.22)" stroke="rgba(255,255,255,0.16)" stroke-width="0.8"/>
  </g>

  <!-- ====== FUNGAL HYPHAE-LIKE STRUCTURES ====== -->
  <g opacity="0.12">
    <path d="M780,180 C790,200 785,230 800,250 C810,265 805,280 820,300" stroke="#95b46a" stroke-width="2" fill="none"/>
    <path d="M820,300 C825,310 830,315 840,305" stroke="#95b46a" stroke-width="1.5" fill="none"/>
    <path d="M800,250 C810,260 815,270 808,280" stroke="#95b46a" stroke-width="1.2" fill="none"/>
  </g>

  <!-- ====== FLOATING ORGANIC MATTER ====== -->
  <g opacity="0.10">
    <circle cx="400" cy="380" r="3" fill="#c4a35a"/>
    <circle cx="550" cy="250" r="4" fill="#c4a35a"/>
    <circle cx="680" cy="430" r="2.5" fill="#c4a35a"/>
    <circle cx="950" cy="320" r="3.5" fill="#c4a35a"/>
    <circle cx="750" cy="160" r="3" fill="#c4a35a"/>
    <circle cx="250" cy="480" r="2.5" fill="#c4a35a"/>
    <circle cx="1150" cy="350" r="3" fill="#c4a35a"/>
    <circle cx="350" cy="150" r="2" fill="#c4a35a"/>
  </g>
</svg>
