<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 800" width="1440" height="800">
  <defs>
    <radialGradient id="glow1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#95b46a" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#95b46a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cell-grad" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.25)"/>
      <stop offset="60%" stop-color="rgba(255,255,255,0.06)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.02)"/>
    </radialGradient>
    <radialGradient id="rod-grad" cx="30%" cy="30%" r="60%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.20)"/>
      <stop offset="70%" stop-color="rgba(255,255,255,0.04)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.01)"/>
    </radialGradient>
    <radialGradient id="dna-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c4a35a" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#c4a35a" stop-opacity="0"/>
    </radialGradient>

    <!-- Soil particle texture -->
    <pattern id="soil-dots" x="0" y="0" width="80" height="80" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="1.5" fill="rgba(0,0,0,0.06)"/>
      <circle cx="40" cy="25" r="1" fill="rgba(0,0,0,0.04)"/>
      <circle cx="65" cy="15" r="2" fill="rgba(0,0,0,0.05)"/>
      <circle cx="20" cy="50" r="1.2" fill="rgba(0,0,0,0.04)"/>
      <circle cx="55" cy="55" r="1.8" fill="rgba(0,0,0,0.05)"/>
      <circle cx="75" cy="70" r="0.8" fill="rgba(0,0,0,0.03)"/>
      <circle cx="5" cy="75" r="1" fill="rgba(0,0,0,0.03)"/>
      <circle cx="35" cy="70" r="1.5" fill="rgba(0,0,0,0.04)"/>
    </pattern>
  </defs>

  <!-- Base gradient -->
  <linearGradient id="bg-grad" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#1b5e4a"/>
    <stop offset="40%" stop-color="#1a4a3a"/>
    <stop offset="100%" stop-color="#0d2818"/>
  </linearGradient>
  <rect width="1440" height="800" fill="url(#bg-grad)"/>

  <!-- Soil particles overlay -->
  <rect width="1440" height="800" fill="url(#soil-dots)" opacity="0.5"/>

  <!-- Glowing orbs -->
  <circle cx="200" cy="300" r="200" fill="url(#glow1)"/>
  <circle cx="1200" cy="250" r="250" fill="url(#glow2)"/>
  <circle cx="720" cy="500" r="300" fill="url(#dna-glow)"/>

  <!-- DNA Helix motif -->
  <g opacity="0.12" transform="translate(1100,100)">
    <path d="M0,0 C30,-60 60,-80 90,-40 C120,0 150,20 180,60" stroke="#c4a35a" stroke-width="2" fill="none"/>
    <path d="M30,-80 C60,-40 90,-20 120,20 C150,60 180,80 210,120" stroke="#c4a35a" stroke-width="2" fill="none"/>
    <line x1="0" y1="0" x2="30" y2="-80" stroke="#c4a35a" stroke-width="1.2" opacity="0.7"/>
    <line x1="90" y1="-40" x2="120" y2="20" stroke="#c4a35a" stroke-width="1.2" opacity="0.7"/>
    <line x1="180" y1="60" x2="210" y2="120" stroke="#c4a35a" stroke-width="1.2" opacity="0.7"/>
  </g>

  <!-- DNA Helix motif 2 -->
  <g opacity="0.08" transform="translate(100,500)">
    <path d="M0,0 C20,-40 40,-55 60,-25 C80,5 100,15 120,40" stroke="#95b46a" stroke-width="1.5" fill="none"/>
    <path d="M20,-55 C40,-25 60,-15 80,15 C100,45 120,55 140,80" stroke="#95b46a" stroke-width="1.5" fill="none"/>
    <line x1="0" y1="0" x2="20" y2="-55" stroke="#95b46a" stroke-width="1" opacity="0.6"/>
    <line x1="60" y1="-25" x2="80" y2="15" stroke="#95b46a" stroke-width="1" opacity="0.6"/>
    <line x1="120" y1="40" x2="140" y2="80" stroke="#95b46a" stroke-width="1" opacity="0.6"/>
  </g>

  <!-- Microbial cells - Cocci groups -->
  <g opacity="0.2" transform="translate(450,180)">
    <circle cx="0" cy="0" r="18" fill="url(#cell-grad)" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
    <circle cx="30" cy="-5" r="14" fill="url(#cell-grad)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
    <circle cx="-22" cy="15" r="12" fill="url(#cell-grad)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
    <circle cx="15" cy="20" r="10" fill="url(#cell-grad)" stroke="rgba(255,255,255,0.10)" stroke-width="1"/>
    <circle cx="-15" cy="-15" r="8" fill="url(#cell-grad)" stroke="rgba(255,255,255,0.10)" stroke-width="1"/>
  </g>

  <g opacity="0.15" transform="translate(300,580)">
    <circle cx="0" cy="0" r="14" fill="url(#cell-grad)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
    <circle cx="25" cy="-8" r="11" fill="url(#cell-grad)" stroke="rgba(255,255,255,0.10)" stroke-width="1"/>
    <circle cx="-18" cy="12" r="9" fill="url(#cell-grad)" stroke="rgba(255,255,255,0.10)" stroke-width="1"/>
    <circle cx="12" cy="16" r="7" fill="url(#cell-grad)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  </g>

  <!-- Rod-shaped bacteria -->
  <g opacity="0.18" transform="translate(800,300) rotate(-20)">
    <rect x="-30" y="-8" width="60" height="16" rx="8" fill="url(#rod-grad)" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
    <circle cx="-22" cy="0" r="3" fill="rgba(255,255,255,0.12)"/>
    <circle cx="22" cy="0" r="3" fill="rgba(255,255,255,0.12)"/>
  </g>

  <g opacity="0.12" transform="translate(650,620) rotate(35)">
    <rect x="-20" y="-5" width="40" height="10" rx="5" fill="url(#rod-grad)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
    <circle cx="-15" cy="0" r="2" fill="rgba(255,255,255,0.10)"/>
    <circle cx="15" cy="0" r="2" fill="rgba(255,255,255,0.10)"/>
  </g>

  <!-- Large cell with visible internal structure -->
  <g opacity="0.10" transform="translate(900,550)">
    <circle cx="0" cy="0" r="30" fill="url(#cell-grad)" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="18" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <circle cx="-8" cy="-6" r="4" fill="rgba(255,255,255,0.10)"/>
    <circle cx="10" cy="5" r="3" fill="rgba(255,255,255,0.08)"/>
    <circle cx="-5" cy="10" r="2" fill="rgba(255,255,255,0.06)"/>
  </g>

  <!-- Small scattered cells -->
  <g opacity="0.1">
    <circle cx="100" cy="200" r="5" fill="rgba(255,255,255,0.12)"/>
    <circle cx="115" cy="210" r="3.5" fill="rgba(255,255,255,0.08)"/>
    <circle cx="108" cy="195" r="2.5" fill="rgba(255,255,255,0.06)"/>

    <circle cx="1300" cy="450" r="6" fill="rgba(255,255,255,0.10)"/>
    <circle cx="1315" cy="460" r="4" fill="rgba(255,255,255,0.08)"/>
    <circle cx="1308" cy="445" r="3" fill="rgba(255,255,255,0.06)"/>

    <circle cx="500" cy="400" r="4" fill="rgba(255,255,255,0.08)"/>
    <circle cx="350" cy="250" r="5" fill="rgba(255,255,255,0.07)"/>

    <!-- Spirillum (spiral) -->
    <path d="M600,450 C600,440 610,440 610,450 C610,460 620,460 620,450 C620,440 630,440 630,450" stroke="rgba(255,255,255,0.10)" stroke-width="1.5" fill="none"/>
  </g>

  <!-- Filamentous bacteria (chains) -->
  <g opacity="0.08" transform="translate(200,150) rotate(45)">
    <circle cx="0" cy="0" r="5" fill="rgba(255,255,255,0.12)" stroke="rgba(255,255,255,0.08)" stroke-width="0.5"/>
    <circle cx="14" cy="0" r="5" fill="rgba(255,255,255,0.12)" stroke="rgba(255,255,255,0.08)" stroke-width="0.5"/>
    <circle cx="28" cy="0" r="5" fill="rgba(255,255,255,0.12)" stroke="rgba(255,255,255,0.08)" stroke-width="0.5"/>
    <circle cx="42" cy="0" r="5" fill="rgba(255,255,255,0.12)" stroke="rgba(255,255,255,0.08)" stroke-width="0.5"/>
    <circle cx="56" cy="0" r="5" fill="rgba(255,255,255,0.10)" stroke="rgba(255,255,255,0.06)" stroke-width="0.5"/>
  </g>

  <!-- Root/hyphae-like structures -->
  <g opacity="0.06">
    <path d="M800,200 C810,220 805,250 820,270 C830,285 825,300 840,320" stroke="#95b46a" stroke-width="1.5" fill="none"/>
    <path d="M840,320 C845,330 850,335 860,325" stroke="#95b46a" stroke-width="1.2" fill="none"/>
    <path d="M820,270 C830,280 835,290 828,300" stroke="#95b46a" stroke-width="1" fill="none"/>
  </g>

  <!-- Floating soil organic matter particles -->
  <g opacity="0.06">
    <circle cx="400" cy="350" r="2" fill="#c4a35a"/>
    <circle cx="550" cy="280" r="3" fill="#c4a35a"/>
    <circle cx="680" cy="400" r="1.5" fill="#c4a35a"/>
    <circle cx="950" cy="350" r="2.5" fill="#c4a35a"/>
    <circle cx="750" cy="180" r="2" fill="#c4a35a"/>
    <circle cx="250" cy="450" r="1.8" fill="#c4a35a"/>
    <circle cx="1150" cy="300" r="2" fill="#c4a35a"/>
  </g>
</svg>
